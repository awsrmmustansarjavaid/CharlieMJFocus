name: Build, test and package

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
# This workflow runs ONLY when manually triggered from GitHub.
#
# No automatic execution on:
# - Git commits
# - Git pushes
# - Pull requests
# - Version tags
# ============================================================

on:
  workflow_dispatch:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Adds a "Run workflow" button on the Actions tab for building fresh downloads at any time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------
  # 1. Restore, build and run every automated test (unit tests and real-SQLite integration tests).
  # ---------------------------------------------------------------------------------------------
  verify:
    name: Restore, build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CharlieMJFocus.sln

      - name: Build
        run: dotnet build CharlieMJFocus.sln -c Release --no-restore

      - name: Test
        run: dotnet test CharlieMJFocus.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-MJ-Focus-Test-Results
          path: '**/test-results.trx'
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # 2a. Portable edition: one self-contained Charlie-MJ-Focus.exe (no .NET install needed).
  # ---------------------------------------------------------------------------------------------
  portable:
    name: Build portable EXE
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish portable EXE
        shell: pwsh
        run: ./scripts/publish-portable.ps1

      # Fails the job if the EXE is missing or tiny, and records its size and SHA-256 on the run summary.
      - name: Verify portable package
        shell: pwsh
        run: ./scripts/verify-package.ps1 -Directory artifacts/portable/Charlie-MJ-Focus -ExeFilter 'Charlie-MJ-Focus.exe' -Title 'Portable package'

      # The artifact is the ready-to-run folder: Charlie-MJ-Focus.exe, portable.flag and a short README.
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Portable
          path: artifacts/portable/Charlie-MJ-Focus/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # 2b. Installer edition: Charlie-MJ-Focus-Setup-<version>.exe (Inno Setup).
  # ---------------------------------------------------------------------------------------------
  installer:
    name: Build Windows installer
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./scripts/publish-installer.ps1

      - name: Verify installer
        shell: pwsh
        run: ./scripts/verify-package.ps1 -Directory artifacts/installer -ExeFilter 'Charlie-MJ-Focus-Setup-*.exe' -Title 'Installer'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # 3. Launch the portable EXE for real, photograph every page, and fail on crashes or logged errors.
  #    Screenshots are uploaded so the UI can be reviewed without installing anything.
  # ---------------------------------------------------------------------------------------------
  smoke-test:
    name: Launch test and screenshots
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download portable app
        uses: actions/download-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Portable
          path: smoke-app

      - name: Launch every page and check for errors
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -AppDir smoke-app -OutDir smoke-out

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-MJ-Focus-UI-Screenshots
          path: smoke-out/*
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # 4. Publish a GitHub Release (only when a version tag such as v0.1.0 is pushed).
  #    Needs both packages, but deliberately does not wait for the screenshot job.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, installer]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download portable app
        uses: actions/download-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Portable
          path: release/portable

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Installer
          path: release/installer

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "release/Charlie-MJ-Focus-$($env:TAG)-portable-win-x64.zip"
          Compress-Archive -Path 'release/portable/*' -DestinationPath $zip
          $setup = Get-ChildItem release/installer -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'The installer was not downloaded.' }
          gh release create $env:TAG $zip $setup.FullName --title "Charlie MJ Focus $($env:TAG)" --generate-notes
