name: Build, test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Restore, build and test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CharlieMJFocus.sln

      - name: Build solution
        run: dotnet build CharlieMJFocus.sln -c Release --no-restore

      - name: Run automated tests
        run: dotnet test CharlieMJFocus.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charlie-mj-focus-test-results
          path: '**/test-results.trx'
          if-no-files-found: warn
          retention-days: 14

  portable:
    name: Package portable Windows app
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish portable single-file executable
        shell: pwsh
        run: ./scripts/publish-portable.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-MJ-Focus-Portable-Windows-x64
          path: |
            artifacts/portable/Charlie MJ Focus/**
            artifacts/portable/*.zip
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Build Windows installer
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Publish and package installer
        shell: pwsh
        run: ./scripts/publish-installer.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Installer-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, installer]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: Charlie-MJ-Focus-Portable-Windows-x64
          path: release-assets/portable
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Charlie-MJ-Focus-Windows-Installer-x64
          path: release-assets/installer
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -Recurse -File | ForEach-Object { $_.FullName }
          if (-not $assets) { throw 'No release assets were downloaded.' }
          gh release create "${{ github.ref_name }}" $assets --title "Charlie MJ Focus ${{ github.ref_name }}" --generate-notes
