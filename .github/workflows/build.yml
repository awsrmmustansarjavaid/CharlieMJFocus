name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Adds a "Run workflow" button on the Actions tab, so you can build a fresh .exe at any time.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CharlieMJFocus.sln

      - name: Build
        run: dotnet build CharlieMJFocus.sln -c Release --no-restore

      - name: Test
        run: dotnet test CharlieMJFocus.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  # Builds the portable Windows .exe after every successful build on main (and for pull requests'
  # manual runs). Download it from the run's "Artifacts" section on the Actions tab.
  portable:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write   # only needed to attach the zip to a GitHub Release on version tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish portable package
        shell: pwsh
        run: ./scripts/publish-portable.ps1

      # The artifact is the ready-to-run folder: CharlieMJFocus.exe + portable.flag.
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: CharlieMJFocus-portable-win-x64
          path: artifacts/portable/CharlieMJFocus/*
          if-no-files-found: error

      # Pushing a tag such as v0.1.0 also creates a public GitHub Release with the zip attached.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem artifacts/portable/*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "Charlie MJ Focus ${{ github.ref_name }}" --generate-notes
