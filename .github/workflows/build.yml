name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CharlieMJFocus.sln

      - name: Build
        run: dotnet build CharlieMJFocus.sln -c Release --no-restore

      - name: Test
        run: dotnet test CharlieMJFocus.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  # Builds the downloadable portable package whenever a version tag such as v0.1.0 is pushed.
  portable:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish portable package
        shell: pwsh
        run: ./scripts/publish-portable.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: artifacts/portable/*.zip
